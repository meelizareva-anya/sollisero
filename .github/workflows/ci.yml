name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # --check fails on broken internal links, missing anchors,
      # unresolved build placeholders and CSP violations.
      - run: node build.mjs --check
